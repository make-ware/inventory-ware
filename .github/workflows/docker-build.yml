name: Docker Build and Publish

on:
  # Allow this workflow to be called from other workflows
  workflow_call:
    inputs:
      version:
        description: 'Version tag to use for Docker images'
        required: false
        type: string
      tag_name:
        description: 'Git tag name (e.g., v1.0.0)'
        required: false
        type: string
  # Trigger on release creation (integrates with release-please)
  release:
    types: [published]
  # Trigger on version tags. release-please tags are component-prefixed
  # (inventory-ware-v1.2.3); the bare form covers a hand-pushed tag.
  push:
    tags:
      - 'inventory-ware-v*.*.*'
      - 'v*.*.*'
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to use for Docker images'
        required: false
        type: string
      tag_name:
        description: 'Git tag name (e.g., v1.0.0)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Docker Hub carries the monolith only, and is optional: set the
  # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets (and optionally the
  # DOCKERHUB_NAMESPACE variable, if the org name differs from the login) to
  # also publish there. Without them every job pushes to GHCR only.
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

jobs:
  build-monolith:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker Hub target
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_REGISTRY: ${{ env.DOCKERHUB_REGISTRY }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Namespace defaults to the login user when the variable is unset.
          NAMESPACE="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
          # Docker Hub repos are single-segment, so mirror the GHCR name only.
          REPO="${GITHUB_REPOSITORY##*/}"

          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$NAMESPACE" ]; then
            DOCKERHUB_IMAGE="$DOCKERHUB_REGISTRY/$NAMESPACE/$REPO"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            DOCKERHUB_IMAGE=""
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured - publishing to ${REGISTRY:-ghcr.io} only."
          fi

          echo "image=$DOCKERHUB_IMAGE" >> "$GITHUB_OUTPUT"
          # peter-evans/dockerhub-description wants namespace/name, no registry.
          echo "repository=${DOCKERHUB_IMAGE#"$DOCKERHUB_REGISTRY/"}" >> "$GITHUB_OUTPUT"

          # Newline-separated list consumed by docker/metadata-action.
          {
            echo "images<<__EOF__"
            echo "$GHCR_IMAGE"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Resolve the release version, in precedence order: the `version` input
      # (release-please passes it), the `tag_name` input, then the git ref when
      # a release publish or tag push triggered this run. Deriving from the ref
      # is what makes every entry point emit the same tags -- release-please
      # tags are component-prefixed (inventory-ware-v1.2.3), which
      # docker/metadata-action's `type=semver` cannot parse on its own.
      - name: Prepare version tags
        id: version-tags
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            VERSION="${{ inputs.tag_name }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=""
          fi

          # inventory-ware-v1.2.3 -> v1.2.3 -> 1.2.3; a bare v1.2.3 also works.
          VERSION="${VERSION#"${GITHUB_REPOSITORY##*/}-"}"
          VERSION="${VERSION#v}"

          # Anything that is not a real version (a branch dispatch, a stray
          # tag) leaves has_version=false, so the build is tagged by sha alone.
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
            echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release version resolved - tagging by sha only."
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.dockerhub.outputs.images }}
          tags: |
            # Version tags, resolved above from the input or the git ref
            type=raw,value=${{ steps.version-tags.outputs.version }},enable=${{ steps.version-tags.outputs.has_version == 'true' }}
            type=raw,value=${{ steps.version-tags.outputs.minor }},enable=${{ steps.version-tags.outputs.has_version == 'true' }}
            type=raw,value=${{ steps.version-tags.outputs.major }},enable=${{ steps.version-tags.outputs.has_version == 'true' }}
            # Tag as latest whenever a real version was resolved
            type=raw,value=latest,enable=${{ steps.version-tags.outputs.has_version == 'true' }}
            # Tag with sha for traceability
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Inventoryware Monolithic Container
            org.opencontainers.image.description=Monolithic Docker container with PocketBase, Next.js, and Background Worker
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: monolith
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=monolith
          cache-to: type=gha,mode=max,scope=monolith
          build-args: |
            POCKETBASE_VERSION=0.35.0

      # Compose the Docker Hub overview from only the most recent release
      # section of the changelog. Pushing the full changelog would eventually
      # exceed Docker Hub's 25,000-byte cap and be blindly truncated, breaking
      # the markdown; one release section stays well under the limit.
      - name: Compose Docker Hub description
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          # Most recent release: lines from the first "## [" version heading up
          # to (but not including) the next one.
          {
            echo "📦 Source: [${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY})"
            echo
            echo "# Changelog"
            echo
            awk '/^## \[/ { if (++seen == 2) exit } seen' CHANGELOG.md
          } > DOCKERHUB_README.md

          echo "Docker Hub description: $(wc -c < DOCKERHUB_README.md) bytes"

      # Best-effort: continue-on-error, so a Docker Hub API hiccup can never
      # fail a build whose images already pushed. The action truncates content
      # over Docker Hub's 25,000-byte limit and warns in the log.
      - name: Update Docker Hub description
        if: steps.dockerhub.outputs.enabled == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.dockerhub.outputs.repository }}
          readme-filepath: ./DOCKERHUB_README.md

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary (monolith)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Registries:** ${{ env.REGISTRY }}${{ steps.dockerhub.outputs.enabled == 'true' && format(', {0}', env.DOCKERHUB_REGISTRY) || '' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.dockerhub.outputs.image }}" ]; then
            echo "docker pull ${{ steps.dockerhub.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  # The split images are published to GHCR only - Docker Hub carries the
  # monolith alone, so these jobs have no Docker Hub login or image name.
  build-webapp:
    runs-on: ubuntu-latest
