# Docker Compose configuration for Inventory Ware
# 
# This file uses pre-built images from GitHub Container Registry.
# Images are automatically built and published when releases are created.
#
# Docker Hub carries the monolithic image (`dastron/inventory-ware`) only, so
# these two services always pull from GHCR.

services:
  pocketbase:
    image: ghcr.io/make-ware/inventory-ware-pocketbase:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Optional. Leave both unset and the container generates a superuser into
      # /data/pb_data/.pb_superuser.env on first start; set both to manage the
      # account yourself. Setting exactly one stops the container.
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    image: ghcr.io/make-ware/inventory-ware-webapp:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    # NEXT_PUBLIC_POCKETBASE_URL is inlined by Next.js at build time, so it is
    # baked into the published image (as `/`) and cannot be set here. To point
    # the browser at a different PocketBase origin, build the image from a
    # checkout instead of pulling it:
    #
    #   build:
    #     context: ..
    #     dockerfile: docker/Dockerfile
    #     target: webapp
    #     args:
    #       - NEXT_PUBLIC_POCKETBASE_URL=http://localhost:8090
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Internal URL for server-side route handlers to access PocketBase
      - POCKETBASE_URL=http://pocketbase:8090
      # AI image analysis (optional). Set one provider key and the provider is
      # detected automatically; AI_PROVIDER only disambiguates. Unset variables
      # expand to an empty string, which is treated the same as unset.
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  data:
