# Docker Compose configuration for Inventory Ware
#
# Only the monolithic image is published (ghcr.io/make-ware/inventory-ware and
# dastron/inventory-ware). The split webapp/pocketbase images are no longer
# pushed to any registry, so this file builds those two targets from the
# Dockerfile in this repo. Run it from a checkout:
#
#   docker compose -f docker/docker-compose.yml up -d --build

services:
  pocketbase:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: pocketbase
    image: inventory-ware-pocketbase:local
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - data:/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: webapp
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so the browser-facing
        # PocketBase URL has to be passed here, not only as a runtime env var.
        - NEXT_PUBLIC_POCKETBASE_URL=${NEXT_PUBLIC_POCKETBASE_URL:-http://localhost:8090}
    image: inventory-ware-webapp:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Internal URL for server-side route handlers to access PocketBase
      - POCKETBASE_URL=http://pocketbase:8090
      # AI image analysis (optional). Set one provider key and the provider is
      # detected automatically; AI_PROVIDER only disambiguates. Unset variables
      # expand to an empty string, which is treated the same as unset.
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      pocketbase:
        condition: service_healthy

volumes:
  data:
